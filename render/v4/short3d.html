  const tl = cue(bl, 'launch');
  if (t < TM.beats[br].start) return t < tl ? 2.55 : 2.55 + 60 * (t - tl);
  if (t < TM.beats[bb].start) { const b = TM.beats[br]; return 8 + 40 * ease((t - b.start) / (b.end - b.start + 0.2)); }
  return 48 + 4 * ease((t - TM.beats[bb].start) / 1.5);
}

SCENES = {
  hookSky: (t, b) => { const p = (t - b.start) / b.dur; look([0, 14, 76 - 8 * p], [0, 44, 0]); },
  tease: (t, b) => { const p = (t - b.start) / b.dur; look([0, 22, 62 - 8 * p], [0, 46, 0]); },
  launch: (t, b, bi) => {
    const tl = cue(bi, 'launch'), k = ease((t - tl) / 1.1);
    look(lerp3([6.5, 3.2, 12], [5, 9, 24], t > tl ? k : 0), lerp3([0, 2.6, 0], [0, 26, 0], t > tl ? k : 0));
    shell.visible = true; shell.position.set(0, shellY(t), 0);
    fill.position.set(2.5, 5, 4); fill.color.set(0xffa040); fill.intensity = 10 + (t > tl ? 80 * Math.exp(-(t - tl) * 4) : 0);
  },
  rise: (t, b) => { const y = shellY(t); shell.visible = true; shell.position.set(0, y, 0); look([7, y - 3, 15], [0, y + 1.5, 0]); sparks(t); },
  cutaway: (t, b) => { const p = (t - b.start) / b.dur; cut.rotation.set(0.12, -0.55 + p * 0.5, 0); look([0.4, 300.4, 8.8 - p * 1.3], [0, 300, 0]);
    key.intensity = 1.5; key.position.set(5, 306, 9); key.target.position.copy(CUT); fill.position.set(-6, 302, 6); fill.color.set(0x6f8cff); fill.intensity = 5;
    cutFuseTip.scale.setScalar(1 + 0.3 * Math.sin(t * 30)); },
  boom: (t, b, bi) => { const tb = cue(bi, 'boom'); look([0, 16, 84], [0, 48, 0]); if (t < tb) { shell.visible = true; shell.position.set(0, shellY(t), 0); sparks(t); } },
  colors: (t, b) => { const p = (t - b.start) / b.dur; look([0, 18, 92 - 8 * p], [0, 48, 0]); },
  blueFail: (t, b) => { const p = (t - b.start) / b.dur; look([0, 30, 52 - 6 * p], [0, 48, 0]); },
  blueFail2: (t, b) => { const p = (t - b.start) / b.dur; look([0, 30, 50 - 6 * p], [0, 48, 0]); },
  atom: (t, b, bi) => {
    const p = (t - b.start) / b.dur; look([0, 520.6, 11.5 - p * 1.2], [0, 520, 0]);
    key.intensity = 1.4; key.position.set(4, 526, 8); key.target.position.copy(ATOM);
    atom.rotation.set(0.35, 0, 0);
    const tu = cue(bi, 'whoosh'), tf = cue(bi, 'ding');
    let r = 2.0; if (t > tu) r = 2.0 + 1.5 * ease((t - tu) / 0.4); if (t > tf) r = 3.5 - 1.5 * ease((t - tf) / 0.3);
    const a = t * 3.2; electron.position.set(Math.cos(a) * r, Math.sin(a) * r, 0);
    electron.scale.setScalar(t > tu && t < tf ? 1.4 + 0.2 * Math.sin(t * 25) : 1);
    const pa = photonGeo.attributes.position.array, len = t > tf ? Math.min(9, (t - tf) * 12) : 0;
    const ex = Math.cos(tf * 3.2) * 2, ey = Math.sin(tf * 3.2) * 2;
    for (let i = 0; i < 240; i++) { const u = i / 239 * len; pa[i * 3] = ex + u; pa[i * 3 + 1] = ey + Math.sin(u * 7 - t * 20) * 0.32 * (len ? 1 : 0); pa[i * 3 + 2] = 0.3; }
    photonGeo.attributes.position.needsUpdate = true; photon.visible = len > 0;
  },
  purple: (t, b) => { const p = (t - b.start) / b.dur; look([0, 18, 86 - 6 * p], [0, 48, 0]); },
  heart: (t, b) => { const p = (t - b.start) / b.dur; look([0, 20, 80 - 6 * p], [0, 48, 0]); },
};
function sparks(t) {
  for (let k = 0; k < 46; k++) {
    const tk = t - k * 0.022, y = shellY(tk);
    const jx = (hash(k, Math.floor(t * 30)) - 0.5) * 0.5 * (k / 46 + 0.2), jz = (hash(k + 99, Math.floor(t * 30)) - 0.5) * 0.5 * (k / 46 + 0.2);
    addP(jx, y - 0.6 - k * 0.02, jz, GOLD, 0.55 - k * 0.006, (1 - k / 46) * (0.6 + 0.4 * hash(k, Math.floor(t * 40))));
  }
}

const ANCHORS = {
  fuse: () => cutFuseTip.getWorldPosition(new THREE.Vector3()), core: () => core.getWorldPosition(new THREE.Vector3()),
  star: () => starMeshes[3].getWorldPosition(new THREE.Vector3()), star2: () => starMeshes[10].getWorldPosition(new THREE.Vector3()),
  electron: () => electron.getWorldPosition(new THREE.Vector3()),
  blast: (bi) => { const b = BURSTS.filter(b => b.bi === bi).slice(-1)[0]; return b ? b.p.clone() : new THREE.Vector3(0, 48, 0); },
};
const toScreen = v => { const p = v.clone().project(camera); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H, p.z < 1]; };

window.init = function () {
  SPEC = window.SPEC; TM = window.TIMING; BEATS = TM.beats;
  const hookEnd = TM.hooks.length ? TM.hooks[0].end : -1;
  TM.beats.forEach(bt => { if (bt.start < hookEnd) return; let cur = [];
    bt.words.forEach((w, j) => { cur.push(w); if (cur.length === 3 || /[.,!?;:]$/.test(w.w) || j === bt.words.length - 1) { CHUNKS.push(cur); cur = []; } }); });
  CHUNKS.forEach((c, i) => { c.from = c[0].s - 0.05; c.to = i + 1 < CHUNKS.length ? Math.min(CHUNKS[i + 1][0].s - 0.05, c[c.length - 1].e + 0.5) : TM.total; });
  // fireworks timeline (synced to the same cues as the sound)
  const B = (bi, t0, x, y, z, col, o) => { burst(t0, x, y, z, col, o); BURSTS[BURSTS.length - 1].bi = bi; };
  SPEC.beats.forEach((b, bi) => {
    const bt = TM.beats[bi];
    if (b.scene === 'hookSky') { B(bi, -0.45, -9, 50, 0, 0xff2d4b, { n: 380 }); const h = TM.hooks[0];
      B(bi, h.lineT[0], 12, 42, -6, 0xffc92d, { n: 300 }); B(bi, h.lineT[1], -15, 38, -10, 0x2dff6a, { n: 300 }); B(bi, h.lineT[2], 4, 54, 0, 0xff2d4b, { n: 480, speed: 22 }); }
    if (b.scene === 'tease') B(bi, cue(bi, 'burst'), 0, 47, 0, 0x2d6bff, { n: 260, weak: true, wash: cue(bi, 'zap'), speed: 15 });
    if (b.scene === 'launch') B(bi, cue(bi, 'launch'), 0, 3.1, 0, 0xffb040, { n: 120, speed: 6, life: 0.7, grav: 8, size: 0.25 });
    if (b.scene === 'boom') { const tb = cue(bi, 'boom'); B(bi, tb, 0, 52, 0, 0xff3d6a, { n: 520, speed: 24 }); B(bi, tb + 0.05, 0, 52, 0, 0x3dd9ff, { n: 300, speed: 17 }); B(bi, tb + 0.3, 0, 52, 0, 0xffd27a, { n: 260, speed: 11, life: 2.2 }); }
    if (b.scene === 'colors') { const xs = [-17, -6, 6, 17], ys = [47, 54, 45, 52]; (b.do.find(a => a.tiles) || {}).tiles?.forEach((tl, i) => B(bi, wordT(bi, tl.at), xs[i], ys[i], -4, tl.color, { n: 300, speed: 13 })); }
    if (b.scene === 'blueFail') B(bi, bt.start + 0.2, 0, 48, 0, 0x2d6bff, { n: 460, speed: 18 });
    if (b.scene === 'blueFail2') B(bi, cue(bi, 'burst'), 0, 48, 0, 0x2d6bff, { n: 460, speed: 18, wash: cue(bi, 'zap'), life: 3.2 });
    if (b.scene === 'purple') { B(bi, bt.start + 0.15, -14, 46, 0, 0xff2d4b, { n: 220, speed: 12 }); B(bi, bt.start + 0.55, 14, 46, 0, 0x2d6bff, { n: 220, speed: 12 }); B(bi, cue(bi, 'boom'), 0, 50, 0, 0xb14dff, { n: 620, speed: 23 }); }
    if (b.scene === 'heart') { const tb = cue(bi, 'boom'); B(bi, tb, 0, 50, 0, 0xff3d8a, { n: 420, speed: 20, shape: 'heart', grav: 1.5, glitter: false }); B(bi, tb + 0.45, -18, 40, -6, 0xffc92d, { n: 220, speed: 11 }); B(bi, tb + 0.75, 18, 44, -6, 0xffc92d, { n: 220, speed: 11 }); }
  });
  window.DURATION = TM.total;
};

window.render = function (t) {
  const T = TM.total; $('bar').style.width = (clamp(t / T) * 100) + '%';
  let bi = TM.beats.findIndex((b, i) => t < (TM.beats[i + 1] ? TM.beats[i + 1].start : Infinity)); if (bi < 0) bi = TM.beats.length - 1;
  const b = SPEC.beats[bi], bt = TM.beats[bi];
  // reset per-frame state
  np = 0; shell.visible = false; key.intensity = 0; fill.intensity = 0; photon.visible = false;
  (SCENES[b.scene] || SCENES.colors)(t, bt, bi);
  drawBursts(t);
  pGeo.setDrawRange(0, np); ['position', 'pcolor', 'size', 'alpha'].forEach(a => pGeo.attributes[a].needsUpdate = true);

  // camera shake on impacts
  let sx = 0, sy = 0;
  for (const s of TM.fx.impacts) { const d = t - s; if (d < 0 || d > 0.5) continue; const a = 0.014 * Math.exp(-d * 8); sx += Math.sin(d * 80) * a; sy += Math.cos(d * 65) * a; }
  camera.rotateX(sy); camera.rotateY(sx);

  // mascot
  const inK = TM.hooks.length ? (t - TM.drop) / 0.4 : 1;
  volt.visible = inK > 0;
  const sc = 0.5 * (0.4 + 0.6 * back(inK)); volt.scale.setScalar(sc);
  const speaking = bt.words.some(w => t >= w.s && t < w.e + 0.03);
  volt.position.y = -1.47 + Math.sin(t * 3) * 0.025; head.rotation.set(Math.sin(t * 1.3) * 0.06, 0.35 + Math.sin(t * 0.9) * 0.12, Math.sin(t * 2.1) * 0.05);
  mouth.scale.set(1, speaking ? 0.6 + 2.2 * Math.abs(Math.sin(t * 26)) : 0.6, 1);
  const blink = (t % 3.1) < 0.12 ? 0.15 : 1; eyeL.scale.y = eyeR.scale.y = blink;
  pivL.rotation.z = -0.25 + Math.sin(t * 2) * 0.05;
  const point = ['cutaway', 'atom', 'colors'].includes(b.scene);
  pivR.rotation.z = point ? 2.3 + Math.sin(t * 4) * 0.08 : 0.25 + Math.sin(t * 2 + 1) * 0.05;
  antBall.scale.setScalar(1 + 0.25 * Math.sin(t * 8));

  composer.render();

  // ---------------- overlays
  $('label').textContent = SPEC.label || ''; $('label').style.opacity = inK > 0 && !(b.do.some(a => a.cta)) ? 1 : 0;
  // 3D-pinned tags
  const svg = $('tags').querySelector('svg'); let tagsHTML = '', lines = '';
  (b.do.find(a => a.tags) || {}).tags?.forEach((tg, i) => {
    const t0 = wordT(bi, tg.at); if (t < t0) return;
    const [x, y, vis] = toScreen(ANCHORS[tg.anchor](bi)); if (!vis) return;
    const k = back((t - t0) / 0.3), side = x > W / 2 ? -1 : 1, tx = x + side * 140, ty = Math.max(300, y - 120 - (i % 2) * 40);
    lines += `<line x1="${x}" y1="${y}" x2="${tx}" y2="${ty}" stroke="#fff" stroke-width="5" opacity="${clamp(k)}"/><circle cx="${x}" cy="${y}" r="${12 * clamp(k)}" fill="#C6FF3D" stroke="#0B0C10" stroke-width="4"/>`;
    tagsHTML += `<div class="tag" style="left:${tx}px;top:${ty}px;transform:translate(${side > 0 ? '0' : '-100%'},-50%) scale(${0.4 + 0.6 * k})">${esc(tg.text)}</div>`;
  });
  svg.innerHTML = lines; $('tags').querySelectorAll('.tag').forEach(e => e.remove()); $('tags').insertAdjacentHTML('beforeend', tagsHTML);
  // element tiles
  const tl = (b.do.find(a => a.tiles) || {}).tiles;
  $('tiles').innerHTML = tl ? tl.map(x => { const t0 = wordT(bi, x.at), k = (t - t0) / 0.3; if (k < 0) return '<div class="tile" style="opacity:0;border-color:transparent"></div>';
    return `<div class="tile" style="border-color:${x.color};box-shadow:0 0 50px ${x.color}88;transform:scale(${0.3 + 0.7 * back(k)})"><div class="sym" style="text-shadow:0 0 30px ${x.color}">${x.sym}</div><div class="nm">${x.name}</div></div>`; }).join('') : '';
  // hook
  const Hk = TM.hooks.find(h => t >= h.t - 0.5 && t < h.end + 0.25), hk = $('hook');
  if (Hk) {
    const out = ease((t - Hk.end) / 0.25); hk.className = 'tone-' + (Hk.tone || 'red');
    const ls = Hk.lineT.map((lt, j) => { const k = j === 0 ? Math.max(0.75, (t - lt) / 0.16) : (t - lt) / 0.16; if (k < 0) return ''; const txt = esc(Hk.lines[j]).replace(/\*(.+?)\*/g, '<span class="e">$1</span>');
      return `<div class="ln" style="transform:scale(${2.4 - 1.4 * ease(k)}) rotate(${(1 - ease(k)) * (j % 2 ? 6 : -6)}deg);opacity:${clamp(k * 3)}">${txt}</div>`; }).join('');
    const ek = (t - Hk.emojiT) / 0.3;
    hk.innerHTML = `<div class="emo" style="opacity:${ek > 0 ? 1 : 0};transform:scale(${0.2 + 0.8 * back(ek)})">${Hk.emoji || ''}</div>` + ls;
    hk.querySelectorAll('.ln').forEach(el => { const w = el.scrollWidth; if (w > 960) el.style.fontSize = Math.floor(150 * 960 / w) + 'px'; });
    hk.style.opacity = 1 - out; hk.style.background = `rgba(4,5,10,${0.42 * (1 - out)})`;
  } else { hk.innerHTML = ''; hk.style.background = 'none'; }
  // CTA
  const cta = (b.do.find(a => a.cta) || {}).cta, ct = $('cta'), ar = $('arrow');
  if (cta) { const k = (t - bt.start - 0.15) / 0.3, fs = cta.text.length > 16 ? 66 : cta.text.length > 12 ? 78 : 96;
    ct.innerHTML = `<div class="big" style="font-size:${fs}px;transform:scale(${0.3 + 0.7 * back(k)}) rotate(-3deg)">${esc(cta.text)}</div><div class="sub" style="opacity:${ease((t - bt.start - 0.5) / 0.3)}">${esc(cta.sub || '')}</div>`;
    ct.style.opacity = k > 0 ? 1 : 0; ar.textContent = '👉'; ar.style.opacity = ease((t - bt.start - 0.6) / 0.2); ar.style.transform = `translateX(${Math.sin(t * 10) * 18}px) rotate(20deg)`;
  } else { ct.innerHTML = ''; ar.style.opacity = 0; }
  // captions
  const ch = (!Hk && !cta) ? CHUNKS.find(c => t >= c.from && t < c.to) : null;
  $('cap').innerHTML = ch ? ch.map(w => `<span class="${w.em ? 'em' : ''} ${t >= w.s && t < w.e ? 'on' : ''}" style="transform:scale(${t >= w.s && t < w.e ? 1.12 : 1})">${esc(w.w)}</span>`).join(' ') : '';
  $('cap').style.transform = ch ? `scale(${0.85 + 0.15 * back((t - ch.from) / 0.14)})` : '';
  // whip transitions between scenes + flashes
  let x = 0, blur = 0;
  for (const w of TM.fx.whips) {
    if (t >= w - 0.12 && t < w) { const k = easeIn((t - (w - 0.12)) / 0.12); x = -900 * k; blur = 24 * k; }
    else if (t >= w && t < w + 0.14) { const k = 1 - ease((t - w) / 0.14); x = 900 * k; blur = 24 * k; }
  }
  $('gl').style.transform = `translateX(${x}px)`; $('gl').style.filter = blur > 0.5 ? `blur(${blur}px)` : 'none';
  let fl = 0; for (const f of TM.fx.flashes) { const d = t - f; if (d >= 0 && d < 0.25) fl = Math.max(fl, 0.6 * (1 - ease(d / 0.25))); }
  $('flash').style.opacity = fl;
};
window.READY = true;
</script>
