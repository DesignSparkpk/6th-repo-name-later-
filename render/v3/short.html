<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Version 3 Short. make.js injects window.SPEC + window.TIMING (from audio.py), calls init(), then render(t) per frame. -->
<style>
  :root { --lime:#C6FF3D; --ink:#0B0C10; --yellow:#FFE53B; --red:#FF3B5C; --blue:#3D7BFF; --green:#19C37D; }
  * { box-sizing:border-box; margin:0; padding:0; font-variant-ligatures:none; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:#06070B; }
  body { font-family:'Inter',sans-serif; color:var(--ink); }
  #bg { position:absolute; inset:-80px; }
  .blob { position:absolute; width:1100px; height:1100px; border-radius:50%; filter:blur(140px); opacity:.55; }
  #grain { position:absolute; inset:0; opacity:.07; mix-blend-mode:overlay; pointer-events:none; }
  #vig { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.7) 100%); }
  #rays { position:absolute; left:50%; top:42%; width:3200px; height:3200px; margin:-1600px 0 0 -1600px; opacity:0;
          background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.07) 0deg 6deg, transparent 6deg 18deg); }
  #cam { position:absolute; inset:0; transform-origin:50% 45%; }
  #label { position:absolute; top:128px; left:50%; transform:translateX(-50%); white-space:nowrap; font-weight:900; font-size:32px; letter-spacing:3px;
           color:var(--ink); background:var(--lime); padding:14px 30px; border-radius:40px; box-shadow:0 0 50px rgba(198,255,61,.45); }
  #phone { position:absolute; left:60px; width:960px; top:230px; height:1060px; border-radius:60px; background:#F6F7F9; overflow:hidden;
           box-shadow:0 40px 120px rgba(0,0,0,.6), 0 0 0 3px rgba(255,255,255,.12), 0 0 90px rgba(61,123,255,.25); transform-origin:50% 30%; }
  #ph-top { height:118px; background:#fff; border-bottom:2px solid #E7E9EE; display:flex; align-items:center; gap:20px; padding:0 40px; }
  #ph-top .lg { width:62px; height:62px; border-radius:18px; background:var(--ink); display:flex; align-items:center; justify-content:center; }
  #ph-top .lg svg { width:38px; height:38px; }
  #ph-top .nm { font-weight:800; font-size:40px; } #ph-top .nm small { display:block; font-size:24px; color:#8A8F99; font-weight:600; }
  #ph-top .live { margin-left:auto; display:flex; align-items:center; gap:10px; font-weight:700; font-size:26px; color:#19C37D; }
  #ph-top .live i { width:16px; height:16px; border-radius:50%; background:#19C37D; display:block; }
  #content { position:absolute; left:34px; right:34px; top:150px; bottom:30px; overflow:hidden; }
  #chat { position:absolute; left:0; right:0; top:0; display:flex; flex-direction:column; gap:26px; }
  .msg { font-size:41px; line-height:1.36; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#24272E; color:#fff; padding:24px 32px; border-radius:38px; border-bottom-right-radius:10px; max-width:800px; }
  .ai { align-self:flex-start; display:flex; gap:18px; max-width:880px; }
  .ai .av { flex:none; width:62px; height:62px; border-radius:50%; background:var(--ink); display:flex; align-items:center; justify-content:center; margin-top:4px; }
  .ai .av svg { width:34px; height:34px; }
  .ai .bubble { background:#fff; border:2px solid #E3E5EA; padding:24px 30px; border-radius:38px; border-top-left-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.06); }
  .mono { font-family:'JetBrains Mono'; font-size:36px; font-weight:600; }
  .mk { background-image:linear-gradient(transparent 8%, rgba(255,229,59,.95) 8%, rgba(255,229,59,.95) 92%, transparent 92%);
        background-repeat:no-repeat; -webkit-box-decoration-break:clone; box-decoration-break:clone; border-radius:6px; padding:0 4px; }
  /* list */
  #list { position:absolute; inset:0; }
  #list h2 { position:absolute; top:0; left:0; right:0; z-index:2; background:#F6F7F9; font-family:'Inter Display'; font-weight:900; font-size:54px; padding:6px 10px 22px; }
  #list .rows { position:absolute; left:0; right:0; top:96px; }
  #list .row { display:flex; gap:20px; align-items:flex-start; padding:16px 18px; margin-bottom:6px; font-size:35px; font-weight:600; line-height:1.3; background:#fff; border-radius:22px; border:2px solid #E7E9EE; }
  #list .row b { flex:none; width:60px; height:52px; border-radius:14px; background:#EEF0F3; display:flex; align-items:center; justify-content:center; font-weight:900; color:#6B717C; }
  #list .row.hl { background:var(--lime); border-color:var(--ink); transform:scale(1.04); box-shadow:0 14px 40px rgba(0,0,0,.25); }
  #list .row.hl b { background:var(--ink); color:var(--lime); }
  /* split */
  .panel { border-radius:34px; padding:24px 28px; margin-bottom:24px; background:#fff; }
  .panel .tag { font-weight:900; font-size:30px; letter-spacing:2px; margin-bottom:12px; }
  .panel .p { font-family:'JetBrains Mono'; font-size:29px; font-weight:600; background:#F0F1F4; border-radius:18px; padding:16px 20px; margin-bottom:14px; line-height:1.35; }
  .panel .o { font-size:35px; line-height:1.35; }
  .bad { border:5px solid var(--red); } .bad .tag { color:var(--red); }
  .good { border:5px solid var(--green); } .good .tag { color:var(--green); }
  /* overlays */
  #hook { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 50px; }
  #hook .emo { font-family:'Noto Color Emoji'; font-size:210px; line-height:1; margin-bottom:40px; }
  #hook .ln { font-family:'Inter Display'; font-weight:900; font-size:150px; line-height:1; letter-spacing:-3px; color:#fff;
              text-shadow:0 10px 0 rgba(0,0,0,.35), 0 0 60px rgba(0,0,0,.5); margin:10px 0; white-space:nowrap; }
  #hook .ln .e { padding:0 18px; border-radius:20px; }
  .tone-red .e { background:var(--red); color:#fff; } .tone-lime .e { background:var(--lime); color:var(--ink); } .tone-blue .e { background:var(--blue); color:#fff; }
  #stamp { position:absolute; left:50%; top:620px; font-family:'Inter Display'; font-weight:900; font-size:150px; padding:10px 50px; border-radius:28px;
           border:14px solid; letter-spacing:4px; white-space:nowrap; background:rgba(255,255,255,.92); }
  #stamp.red { color:var(--red); border-color:var(--red); } #stamp.lime { color:#0B0C10; background:var(--lime); border-color:#0B0C10; }
  #react { position:absolute; left:780px; top:930px; width:0; height:0; }
  #react .em { position:absolute; left:-130px; top:-130px; font-family:'Noto Color Emoji'; font-size:260px; line-height:1; filter:drop-shadow(0 14px 30px rgba(0,0,0,.5)); }
  #react .pt { position:absolute; width:26px; height:26px; border-radius:50%; margin:-13px 0 0 -13px; }
  #cta { position:absolute; left:0; right:0; top:700px; display:flex; flex-direction:column; align-items:center; }
  #cta .big { font-family:'Inter Display'; font-weight:900; font-size:96px; color:var(--ink); background:var(--lime); padding:22px 48px; border-radius:36px;
              box-shadow:0 0 0 8px #0B0C10, 0 20px 80px rgba(198,255,61,.55); white-space:nowrap; }
  #cta .sub { margin-top:36px; font-weight:900; font-size:58px; color:#fff; text-shadow:0 4px 20px rgba(0,0,0,.8); }
  #arrow { position:absolute; right:40px; top:1420px; font-size:150px; font-family:'Noto Color Emoji'; }
  #cap { position:absolute; left:50px; right:50px; top:1340px; text-align:center; font-family:'Inter Display'; font-weight:900; font-size:96px; line-height:1.08;
         color:#fff; -webkit-text-stroke:12px #000; paint-order:stroke fill; text-transform:uppercase; letter-spacing:1px;
         filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)); }
  #cap span { display:inline-block; }
  #cap span.em { color:var(--lime); } #cap span.on { color:var(--yellow); }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #bar { position:absolute; top:0; left:0; height:12px; background:linear-gradient(90deg, var(--lime), #7CFFB2); box-shadow:0 0 30px var(--lime); }
</style>
</head>
<body>
<div id="bg">
  <div class="blob" id="b1" style="background:#2D52FF"></div>
  <div class="blob" id="b2" style="background:#8B3DFF"></div>
  <div class="blob" id="b3" style="background:#00C2A8"></div>
</div>
<div id="rays"></div>
<svg id="grain" width="1080" height="1920"><filter id="n"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="1"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div id="vig"></div>
<div id="cam">
  <div id="label"></div>
  <div id="phone">
    <div id="ph-top"><div class="lg"><svg viewBox="0 0 24 24"><path d="M13.2 1.8L4.2 13.6h6.6l-1.2 8.6 9.6-12.6h-6.8l.8-7.8z" fill="#C6FF3D"/></svg></div>
      <div class="nm">AI Chat<small id="handle"></small></div><div class="live"><i></i>online</div></div>
    <div id="content"><div id="chat"></div></div>
  </div>
  <div id="stamp"></div>
  <div id="react"></div>
  <div id="cta"></div>
  <div id="arrow"></div>
  <div id="hook"></div>
  <div id="cap"></div>
</div>
<div id="flash"></div>
<div id="bar"></div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 3);
const back = x => { x = clamp(x); const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const AV = '<div class="av"><svg viewBox="0 0 24 24"><path d="M13.2 1.8L4.2 13.6h6.6l-1.2 8.6 9.6-12.6h-6.8l.8-7.8z" fill="#C6FF3D"/></svg></div>';
let TM, CHUNKS = [];

window.init = function () {
  TM = window.TIMING;
  $('handle').textContent = window.HANDLE || '';
  const hookEnd = TM.hooks.length ? TM.hooks[0].end : -1;
  TM.beats.forEach(bt => {
    if (bt.start < hookEnd) return;           // hook beat is shown as kinetic text instead of captions
    let cur = [];
    bt.words.forEach((w, j) => {
      cur.push(w);
      if (cur.length === 3 || /[.,!?;:]$/.test(w.w) || j === bt.words.length - 1) { CHUNKS.push(cur); cur = []; }
    });
  });
  CHUNKS.forEach((c, i) => { c.from = c[0].s - 0.05; c.to = i + 1 < CHUNKS.length ? Math.min(CHUNKS[i + 1][0].s - 0.05, c[c.length - 1].e + 0.5) : TM.total; });
  window.DURATION = TM.total;
};

function markHTML(text, marks, t) {
  let h = esc(text);
  for (const m of marks) {
    const em = esc(m.text), i = h.indexOf(em);
    if (i < 0) continue;
    const p = ease((t - m.t - 0.1) / 0.45) * 100;
    h = h.slice(0, i) + `<span class="mk" style="background-size:${p}% 100%">${em}</span>` + h.slice(i + em.length);
  }
  return h;
}

window.render = function (t) {
  const T = TM.total;
  $('bar').style.width = (clamp(t / T) * 100) + '%';
  // background motion + grain
  const bl = [[0.17, 0.11, 140, 300], [0.13, 0.19, 640, 900], [0.09, 0.15, 200, 1400]];
  bl.forEach(([a, b, x, y], i) => { $('b' + (i + 1)).style.transform = `translate(${x + Math.sin(t * a * 6 + i) * 260 - 550}px, ${y + Math.cos(t * b * 6 + i * 2) * 260 - 550}px)`; });
  $('turb').setAttribute('seed', Math.floor(t * 24) % 50);

  // replay state
  let label = '', msgs = [], list = null, hl = null, split = null, react = null, stamp = null, cta = null, marks = [], zoom = null, beatStart = 0;
  for (const e of TM.events) {
    if (e.t > t) break;
    beatStart = e.t; const a = e.a;
    if (a.label) label = a.label;
    if (a.user) msgs.push({ who: 'user', text: a.user, t: e.t });
    if (a.ai) msgs.push({ who: 'ai', text: a.ai, t: e.t, end: e.end });
    if (a.clear) { msgs = []; marks = []; }
    if (a.list) list = { ...a.list, t: e.t, end: e.end };
    if (a.hl) hl = { n: a.hl, t: e.t };
    if (a.split) split = { ...a.split, t: e.t, first: split ? split.first : e.t };
    if (a.react) react = { e: a.react, t: e.t };
    if (a.stamp) stamp = { ...a.stamp, t: e.t, end: e.end };
    if (a.mark) marks.push({ text: a.mark, t: e.t });
    if (a.zoom) zoom = { t: e.t, end: e.end };
    if (a.cta) cta = { ...a.cta, t: e.t };
  }
  $('label').textContent = label;

  // content
  const chat = $('chat');
  if (list) {
    chat.innerHTML = `<div id="list" style="height:880px;position:relative"><h2>${esc(list.title)}</h2><div class="rows">` +
      list.items.map((it, i) => `<div class="row ${hl && hl.n === i + 1 ? 'hl' : ''}"><b>${i + 1}</b><div>${esc(it)}</div></div>`).join('') + '</div></div>';
    const rows = chat.querySelector('.rows'), max = Math.max(0, rows.scrollHeight - 760);
    let off = max * ease((t - list.t - 0.5) / Math.max(1, (list.end - list.t) - 0.8));
    if (hl) { const r = rows.children[hl.n - 1]; off += (clamp(r.offsetTop - 300, 0, max) - off) * ease((t - hl.t) / 0.45); }
    rows.style.transform = `translateY(${-off}px)`; chat.style.transform = '';
  } else if (split) {
    const pan = (p, cls, tag, t0) => { const k = ease((t - t0) / 0.3);
      return `<div class="panel ${cls}" style="opacity:${k};transform:translateX(${(1 - k) * (cls === 'bad' ? -120 : 120)}px)"><div class="tag">${tag}</div><div class="p">${esc(p.prompt)}</div><div class="o">${markHTML(p.out, marks, t)}</div></div>`; };
    chat.innerHTML = pan(split.bad, 'bad', '❌ WHAT MOST PEOPLE TYPE', split.first) + (split.good ? pan(split.good, 'good', '✅ WHAT PROS TYPE', split.t) : '');
    chat.style.transform = '';
  } else {
    chat.innerHTML = msgs.map(m => {
      const k = ease((t - m.t) / 0.25), st = `opacity:${k};transform:translateY(${(1 - k) * 50}px) scale(${0.92 + 0.08 * back((t - m.t) / 0.3)})`;
      if (m.who === 'user') return `<div class="msg user" style="${st}">${esc(m.text)}</div>`;
      const cps = Math.max(m.text.length / Math.max(0.8, (m.end - m.t) * 0.8), 28);
      const n = Math.floor(clamp((t - m.t - 0.15) * cps, 0, m.text.length));
      const body = n >= m.text.length ? markHTML(m.text, marks, t) : esc(m.text.slice(0, n)) + '<span style="opacity:.4">▍</span>';
      return `<div class="msg ai" style="${st}">${AV}<div class="bubble${/^=/.test(m.text) ? ' mono' : ''}">${n ? body : '•••'}</div></div>`;
    }).join('');
    const over = Math.max(0, chat.scrollHeight - 880);
    chat.style.transform = `translateY(${-over}px)`;
  }

  // phone 3D drift + zoom punch on newest message
  let zs = 1, zo = '50% 30%';
  if (zoom && t < zoom.end + 0.3) {
    const last = chat.lastElementChild;
    if (last) { const y = 118 + 150 + last.offsetTop - Math.max(0, chat.scrollHeight - 880) + last.offsetHeight / 2; zo = `50% ${y}px`; }
    zs = 1 + 0.13 * ease((t - zoom.t) / 0.25) * (1 - ease((t - zoom.end) / 0.3));
  }
  const ph = $('phone');
  ph.style.transformOrigin = zo;
  // fly in on the beat drop, sink back behind the CTA
  const inK = TM.hooks.length ? (t - TM.drop) / 0.35 : 1;
  const ctaK = cta ? ease((t - cta.t) / 0.3) : 0;
  const enter = 0.55 + 0.45 * back(inK);
  ph.style.opacity = (inK > 0 ? 1 : 0) * (1 - 0.6 * ctaK);
  ph.style.filter = ctaK > 0 ? `blur(${ctaK * 8}px)` : 'none';
  $('label').style.opacity = label && inK > 0 ? 1 - ctaK : 0;
  ph.style.transform = `perspective(2200px) translateY(${(1 - clamp(inK)) * 300}px) rotateX(${2 + Math.sin(t * 0.7) * 1.5 + (1 - clamp(inK)) * 25}deg) rotateY(${Math.sin(t * 0.5) * 3}deg) scale(${zs * enter * (1 - 0.12 * ctaK)})`;

  // hook (kinetic slam)
  const H = TM.hooks.find(h => t >= h.t && t < h.end + 0.25);
  const hk = $('hook'), rays = $('rays');
  if (H) {
    const out = ease((t - H.end) / 0.25);
    hk.className = 'tone-' + (H.tone || 'red');
    const lines = H.lineT.map((lt, j) => {
      const k = (t - lt) / 0.16; if (k < 0) return '';
      const txt = esc(H.lines[j]).replace(/\*(.+?)\*/g, '<span class="e">$1</span>');
      return `<div class="ln" style="transform:scale(${2.4 - 1.4 * ease(k)}) rotate(${(1 - ease(k)) * (j % 2 ? 6 : -6)}deg);opacity:${clamp(k * 3)}">${txt}</div>`;
    }).join('');
    const ek = (t - H.emojiT) / 0.3;
    hk.innerHTML = `<div class="emo" style="opacity:${ek > 0 ? 1 : 0};transform:scale(${0.2 + 0.8 * back(ek)}) rotate(${(1 - clamp(ek)) * -30}deg)">${H.emoji || ''}</div>` + lines;
    hk.querySelectorAll('.ln').forEach(el => { const w = el.scrollWidth; if (w > 960) el.style.fontSize = Math.floor(150 * 960 / w) + 'px'; });
    hk.style.opacity = 1 - out; hk.style.transform = `scale(${1 + out * 0.4})`;
    hk.style.background = `rgba(6,7,11,${0.86 * (1 - out)})`;
    rays.style.opacity = 0.9 * (1 - out); rays.style.transform = `rotate(${t * 25}deg)`;
  } else { hk.innerHTML = ''; hk.style.background = 'none'; rays.style.opacity = 0; }

  // stamp
  const sp = $('stamp');
  if (stamp && t < stamp.end + 0.4) {
    const k = (t - stamp.t) / 0.2, o = 1 - clamp((t - stamp.end - 0.1) / 0.3);
    sp.className = stamp.tone || 'red'; sp.textContent = stamp.text;
    sp.style.opacity = (k > 0 ? 1 : 0) * o; sp.style.transform = `translateX(-50%) rotate(-8deg) scale(${2.2 - 1.2 * ease(k)})`;
  } else sp.style.opacity = 0;

  // emoji burst
  const rc = $('react');
  if (react && t - react.t < 1.5) {
    const k = (t - react.t) / 0.35, o = 1 - clamp((t - react.t - 1.1) / 0.4);
    const cols = ['#C6FF3D', '#FFE53B', '#FF3B5C', '#3D7BFF', '#fff'];
    let parts = '';
    for (let i = 0; i < 14; i++) {
      const ang = i / 14 * Math.PI * 2, d = ease((t - react.t) / 0.6) * (200 + (i % 3) * 60);
      parts += `<div class="pt" style="background:${cols[i % 5]};transform:translate(${Math.cos(ang) * d}px,${Math.sin(ang) * d}px) scale(${1 - clamp((t - react.t) / 0.8)})"></div>`;
    }
    rc.innerHTML = parts + `<div class="em" style="transform:scale(${0.2 + 0.8 * back(k)}) rotate(${Math.sin((t - react.t) * 9) * 8 * (1 - clamp(k / 3))}deg)">${react.e}</div>`;
    rc.style.opacity = o;
  } else rc.innerHTML = '';

  // CTA
  const ct = $('cta'), ar = $('arrow');
  if (cta) {
    const k = (t - cta.t - 0.15) / 0.3;
    const fs = cta.text.length > 16 ? 66 : cta.text.length > 12 ? 78 : 96;
    ct.innerHTML = `<div class="big" style="font-size:${fs}px;transform:scale(${0.3 + 0.7 * back(k)}) rotate(-3deg)">${esc(cta.text)}</div><div class="sub" style="opacity:${ease((t - cta.t - 0.5) / 0.3)}">${esc(cta.sub || '')}</div>`;
    ct.style.opacity = k > 0 ? 1 : 0;
    ar.textContent = '👉'; ar.style.opacity = ease((t - cta.t - 0.6) / 0.2);
    ar.style.transform = `translateX(${Math.sin(t * 10) * 18}px) rotate(20deg)`;
  } else { ct.innerHTML = ''; ar.style.opacity = 0; }

  // captions (hidden while hook or CTA big text is up)
  const ch = (!H && !cta) ? CHUNKS.find(c => t >= c.from && t < c.to) : null;
  $('cap').innerHTML = ch ? ch.map(w => `<span class="${w.em ? 'em' : ''} ${t >= w.s && t < w.e ? 'on' : ''}" style="transform:scale(${t >= w.s && t < w.e ? 1.12 : 1})">${esc(w.w)}</span>`).join(' ') : '';
  $('cap').style.transform = ch ? `scale(${0.85 + 0.15 * back((t - ch.from) / 0.14)})` : '';

  // camera: whip transitions, shake on impacts, push-in per beat
  let x = 0, y = 0, rot = 0, sc = 1 + 0.015 * ease((t - beatStart) / 1.5), blur = 0;
  for (const w of TM.fx.whips) {
    if (t >= w - 0.14 && t < w) { const k = easeIn((t - (w - 0.14)) / 0.14); x = -1300 * k; blur = 26 * k; }
    else if (t >= w && t < w + 0.16) { const k = 1 - ease((t - w) / 0.16); x = 1300 * k; blur = 26 * k; }
  }
  for (const s of TM.fx.impacts) {
    const d = t - s; if (d < 0 || d > 0.45) continue;
    const a = 26 * Math.exp(-d * 9);
    x += Math.sin(d * 85) * a; y += Math.cos(d * 70) * a * 0.8; rot += Math.sin(d * 60) * a * 0.04; sc += 0.04 * Math.exp(-d * 10);
  }
  const cam = $('cam');
  cam.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${sc})`;
  cam.style.filter = blur > 0.5 ? `blur(${blur}px)` : 'none';
  let fl = 0;
  for (const f of TM.fx.flashes) { const d = t - f; if (d >= 0 && d < 0.25) fl = Math.max(fl, 0.75 * (1 - ease(d / 0.25))); }
  $('flash').style.opacity = fl;
};
</script>
