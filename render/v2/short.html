<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Version 2 Short. make.js injects window.SPEC (from scripts.js) and window.TIMING (from voice.py), then calls init(). -->
<style>
  :root { --lime:#C6FF3D; --ink:#0E0F12; --yellow:#FFE53B; --red:#FF4D5E; --green:#1DB954; }
  * { box-sizing:border-box; margin:0; padding:0; font-variant-ligatures:none; }
  html, body { width:1080px; height:1920px; overflow:hidden; }
  body { background:#F5F6F8; font-family:'Inter',sans-serif; color:var(--ink); position:relative; }
  #wrap { position:absolute; inset:0; transform-origin:50% 40%; }
  #top { position:absolute; left:0; right:0; top:0; height:190px; background:#fff; border-bottom:2px solid #E6E8EC;
         display:flex; align-items:flex-end; justify-content:center; padding-bottom:30px; gap:18px; }
  #top .logo { width:58px; height:58px; border-radius:16px; background:var(--ink); display:flex; align-items:center; justify-content:center; }
  #top .logo svg { width:36px; height:36px; }
  #top .name { font-weight:800; font-size:44px; }
  #top .name small { display:block; font-size:24px; font-weight:600; color:#8A8F99; margin-top:2px; }
  #label { position:absolute; top:222px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--lime);
           font-weight:800; font-size:30px; letter-spacing:2px; padding:12px 26px; border-radius:40px; white-space:nowrap; }
  #area { position:absolute; left:50px; right:50px; top:310px; height:900px; overflow:hidden; }
  #chat { position:absolute; left:0; right:0; top:0; display:flex; flex-direction:column; gap:26px; }
  .msg { font-size:40px; line-height:1.36; max-width:860px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#2F3238; color:#fff; padding:24px 32px; border-radius:36px; border-bottom-right-radius:10px; max-width:820px; }
  .ai { align-self:flex-start; display:flex; gap:20px; }
  .ai .av { flex:none; width:60px; height:60px; border-radius:50%; background:var(--ink); display:flex; align-items:center; justify-content:center; margin-top:6px; }
  .ai .av svg { width:34px; height:34px; }
  .ai .bubble { background:#fff; border:2px solid #E3E5EA; padding:24px 30px; border-radius:36px; border-top-left-radius:10px;
                box-shadow:0 6px 24px rgba(0,0,0,.05); }
  .mono { font-family:'JetBrains Mono'; font-size:36px; font-weight:600; }
  /* list */
  #list { position:absolute; inset:0; background:#fff; border-radius:36px; border:2px solid #E3E5EA; overflow:hidden; }
  #list h2 { position:absolute; top:0; left:0; right:0; z-index:2; background:#fff; font-family:'Inter Display'; font-weight:900; font-size:52px;
             padding:30px 36px 22px; border-bottom:2px solid #EEF0F3; }
  #list .rows { position:absolute; left:0; right:0; top:120px; }
  #list .row { display:flex; gap:22px; align-items:flex-start; padding:16px 36px; font-size:34px; font-weight:600; line-height:1.3; }
  #list .row b { flex:none; width:58px; color:#8A8F99; font-weight:800; }
  #list .row.hl { background:var(--lime); }
  #list .row.hl b { color:var(--ink); }
  /* split */
  .panel { border-radius:32px; padding:26px 30px; margin-bottom:26px; background:#fff; }
  .panel .tag { font-weight:900; font-size:30px; letter-spacing:2px; margin-bottom:12px; }
  .panel .p { font-family:'JetBrains Mono'; font-size:30px; font-weight:600; background:#F2F3F5; border-radius:18px; padding:16px 20px; margin-bottom:14px; line-height:1.35; }
  .panel .o { font-size:34px; line-height:1.35; }
  .bad { border:4px solid var(--red); } .bad .tag { color:var(--red); }
  .good { border:4px solid var(--green); } .good .tag { color:var(--green); }
  /* card */
  #card { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:330px 80px 0; text-align:center; }
  #card .emo { font-size:190px; line-height:1; margin-bottom:50px; font-family:'Noto Color Emoji'; }
  #card .txt { font-family:'Inter Display'; font-weight:900; font-size:108px; line-height:1.04; letter-spacing:-2px; }
  .t-dark { background:#0E0F12; color:#fff; } .t-dark .hl { color:var(--lime); }
  .t-red { background:#FF4D5E; color:#fff; } .t-red .hl { color:var(--ink); }
  .t-lime { background:var(--lime); color:var(--ink); } .t-lime .hl { color:#2D6BFF; }
  #card .txt.small { font-size:74px; }
  /* react */
  #react { position:absolute; right:90px; top:820px; font-size:230px; font-family:'Noto Color Emoji'; line-height:1; filter:drop-shadow(0 10px 30px rgba(0,0,0,.25)); }
  /* captions */
  #cap { position:absolute; left:60px; right:60px; top:1250px; text-align:center; font-family:'Inter Display'; font-weight:900; font-size:92px;
         line-height:1.1; letter-spacing:1px; color:#fff; -webkit-text-stroke:11px #000; paint-order:stroke fill; text-transform:uppercase; }
  #cap span.on { color:var(--yellow); }
  #bar { position:absolute; top:0; left:0; height:10px; background:var(--lime); z-index:5; }
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><div class="logo"><svg viewBox="0 0 24 24"><path d="M13.2 1.8L4.2 13.6h6.6l-1.2 8.6 9.6-12.6h-6.8l.8-7.8z" fill="#C6FF3D"/></svg></div>
    <div class="name">AI Chat<small id="handle"></small></div></div>
  <div id="label"></div>
  <div id="area"><div id="chat"></div></div>
  <div id="card"></div>
  <div id="react"></div>
  <div id="cap"></div>
</div>
<div id="bar"></div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const md = s => esc(s).replace(/\*([\s\S]+?)\*/g, '<span class="hl">$1</span>').replace(/\n/g, '<br>');
const AV = '<div class="av"><svg viewBox="0 0 24 24"><path d="M13.2 1.8L4.2 13.6h6.6l-1.2 8.6 9.6-12.6h-6.8l.8-7.8z" fill="#C6FF3D"/></svg></div>';
let EVENTS = [], CHUNKS = [], DUR = 0;

window.init = function () {
  const spec = window.SPEC, tm = window.TIMING;
  $('handle').textContent = window.HANDLE || '';
  DUR = tm.total;
  spec.beats.forEach((b, i) => {
    const bt = tm.beats[i];
    b.do.forEach(a => EVENTS.push({ t: bt.start, end: bt.start + bt.dur, a }));
    // caption chunks: up to 3 words, break after punctuation
    let cur = [];
    bt.words.forEach((w, j) => {
      cur.push(w);
      if (cur.length === 3 || /[.,!?;:]$/.test(w.w) || j === bt.words.length - 1) { CHUNKS.push(cur); cur = []; }
    });
  });
  CHUNKS.forEach((c, i) => { c.from = c[0].s; c.to = i + 1 < CHUNKS.length ? Math.min(CHUNKS[i + 1][0].s, c[c.length - 1].e + 0.6) : DUR; });
  window.DURATION = DUR;
};

window.render = function (t) {
  $('bar').style.width = (clamp(t / DUR) * 100) + '%';
  // replay events up to t
  let label = '', msgs = [], card = null, list = null, hl = null, split = null, react = null, beatStart = 0;
  for (const e of EVENTS) {
    if (e.t > t) break;
    beatStart = e.t;
    const a = e.a;
    if (a.label) label = a.label;
    if (a.user) msgs.push({ who: 'user', text: a.user, t: e.t });
    if (a.ai) msgs.push({ who: 'ai', text: a.ai, t: e.t, end: e.end });
    if (a.clear) msgs = [];
    if (a.card) card = { ...a.card, t: e.t };
    if (a.cardOff) card = null;
    if (a.list) list = { ...a.list, t: e.t, end: e.end };
    if (a.hl) hl = { n: a.hl, t: e.t };
    if (a.split) split = { ...a.split, t: e.t, prev: split };
    if (a.react) react = { e: a.react, t: e.t };
  }
  $('label').textContent = label; $('label').style.opacity = label ? 1 : 0;

  // chat
  const chat = $('chat');
  if (list) {
    const n = list.items.length;
    chat.innerHTML = `<div id="list" style="height:860px;position:relative"><h2>${esc(list.title)}</h2><div class="rows">` +
      list.items.map((it, i) => `<div class="row ${hl && hl.n === i + 1 ? 'hl' : ''}"><b>${i + 1}</b><div>${esc(it)}</div></div>`).join('') + '</div></div>';
    const rows = chat.querySelector('.rows'), max = Math.max(0, rows.scrollHeight - 700);
    let off = max * ease((t - list.t - 0.6) / Math.max(1, (list.end - list.t) - 1.2) * 1.0);
    if (hl) {
      const r = rows.children[hl.n - 1], target = clamp(r.offsetTop - 260, 0, max);
      off = off + (target - off) * ease((t - hl.t) / 0.5);
    }
    rows.style.transform = `translateY(${-off}px)`;
    chat.style.transform = ''; chat.style.opacity = ease((t - list.t) / 0.3);
  } else if (split) {
    const pan = (p, cls, tag, t0) => `<div class="panel ${cls}" style="opacity:${ease((t - t0) / 0.3)};transform:translateY(${(1 - ease((t - t0) / 0.3)) * 40}px)">
      <div class="tag">${tag}</div><div class="p">${esc(p.prompt)}</div><div class="o">${esc(p.out)}</div></div>`;
    const goodT = split.good ? split.t : 0, badT = split.prev ? split.prev.t : split.t;
    chat.innerHTML = pan(split.bad, 'bad', '❌ YOUR PROMPT', badT) + (split.good ? pan(split.good, 'good', '✅ PRO PROMPT', goodT) : '');
    chat.style.transform = ''; chat.style.opacity = 1;
  } else {
    chat.innerHTML = msgs.map(m => {
      const k = ease((t - m.t) / 0.28), st = `opacity:${k};transform:translateY(${(1 - k) * 30}px)`;
      if (m.who === 'user') return `<div class="msg user" style="${st}">${esc(m.text)}</div>`;
      const cps = Math.max(m.text.length / Math.max(0.8, (m.end - m.t) * 0.8), 28);
      const shown = m.text.slice(0, Math.floor(clamp((t - m.t - 0.15) * cps, 0, m.text.length)));
      const mono = /^=/.test(m.text) ? ' mono' : '';
      return `<div class="msg ai" style="${st}">${AV}<div class="bubble${mono}">${esc(shown) || '…'}</div></div>`;
    }).join('');
    // keep the newest message in view
    const h = chat.scrollHeight, over = Math.max(0, h - 900);
    chat.style.transform = `translateY(${-over}px)`; chat.style.opacity = 1;
  }

  // card
  const c = $('card');
  if (card) {
    const k = ease((t - card.t) / 0.3);
    c.className = 't-' + (card.tone || 'dark');
    c.innerHTML = `<div class="emo" style="transform:scale(${0.5 + 0.5 * back((t - card.t - 0.1) / 0.4)})">${card.emoji || ''}</div><div class="txt ${card.text.length > 40 ? 'small' : ''}">${md(card.text)}</div>`;
    c.style.opacity = 1; c.style.transform = `translateY(${(1 - k) * 100}%)`;
  } else { c.style.opacity = 0; c.innerHTML = ''; }

  // react emoji
  const r = $('react');
  if (react && t - react.t < 1.6) {
    const k = (t - react.t) / 0.35;
    r.textContent = react.e; r.style.opacity = 1 - clamp((t - react.t - 1.2) / 0.4);
    r.style.transform = `scale(${0.3 + 0.7 * back(k)}) rotate(${(1 - clamp(k)) * -25}deg)`;
  } else r.style.opacity = 0;

  // captions
  const ch = CHUNKS.find(c => t >= c.from && t < c.to);
  $('cap').innerHTML = ch ? ch.map(w => `<span class="${t >= w.s && t < w.e ? 'on' : ''}">${esc(w.w)}</span>`).join(' ') : '';
  const ck = ch ? (t - ch.from) / 0.15 : 0;
  $('cap').style.transform = `scale(${0.9 + 0.1 * back(ck)})`;

  // gentle push-in on every beat
  $('wrap').style.transform = `scale(${1 + 0.012 * ease((t - beatStart) / 1.5)})`;
};
</script>
</body>
</html>
